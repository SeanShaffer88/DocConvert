name: ci-debug
on:
  push:
    branches: [arena/b7712006-docconvert]
permissions:
  contents: read
  pull-requests: write
jobs:
  dbg:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        shell: bash
        run: |
          set +e
          cargo test --locked --no-fail-fast -- --include-ignored > t.txt 2>&1
          code=$?
          python tools/report.py t.txt > report.md || true
          gh pr comment 17 --body-file report.md || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
      - name: note
        if: always()
        shell: bash
        run: |
          gh pr comment 17 --body "debug run finished"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
