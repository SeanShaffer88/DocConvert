name: ci-debug
on:
  push:
jobs:
  dbg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy
        shell: bash
        run: |
          cargo clippy --all-targets --message-format=short -- -D warnings > out.txt 2>&1
          code=$?
          head -30 out.txt | while IFS= read -r line; do echo "::error::H $line"; done
          tail -10 out.txt | while IFS= read -r line; do echo "::error::T $line"; done
          exit $code
      - name: test
        shell: bash
        run: |
          cargo test --locked > t.txt 2>&1
          code=$?
          grep -n "panicked at" -A 14 t.txt | head -160 | while IFS= read -r line; do echo "::error::$line"; done
          exit $code
