name: ci-debug
on:
  push:
jobs:
  dbg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings > out.txt 2>&1
          code=$?
          sed -n 's/^\(.*warning: .*\)$/::error::\1/p' out.txt | head -80
          sed -n 's/^\(.*error\[[^]]*\].*\)$/::error::\1/p' out.txt | head -80
          exit $code
