name: ci-debug
on:
  push:
jobs:
  dbg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: test
        shell: bash
        run: |
          cargo test --locked > t.txt 2>&1
          code=$?
          python tools/report.py t.txt || true
          exit $code
