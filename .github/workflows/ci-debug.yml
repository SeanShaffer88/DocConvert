# TEMPORARY diagnostics workflow. Its only job is to surface clippy and
# test output as check-run annotations, because the Actions log archive
# host is unreachable from the agent sandbox. Deleted before merge.
name: ci-debug
on: push
jobs:
  diagnostics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: clippy
        shell: pwsh
        run: |
          $out = cargo clippy --all-targets -- -D warnings 2>&1 | Out-String
          Write-Host $out
          $code = $LASTEXITCODE
          $lines = $out -split "`n"
          $emitted = 0
          for ($i = 0; $i -lt $lines.Length -and $emitted -lt 10; $i++) {
            if ($lines[$i] -match '^(error|warning)(\[|:)') {
              $slice = $lines[$i..([Math]::Min($i + 6, $lines.Length - 1))] -join ' | '
              $slice = $slice.Replace('%', '%25').Replace("`r", ' ').Replace("`n", ' ')
              if ($slice.Length -gt 900) { $slice = $slice.Substring(0, 900) }
              Write-Host "::error title=clippy::$slice"
              $emitted++
            }
          }
          if ($code -ne 0) { exit 1 }
      - name: test
        shell: pwsh
        run: |
          $out = cargo test --locked 2>&1 | Out-String
          Write-Host $out
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = $out -split "`n" | Where-Object { $_.Trim().Length -gt 0 }
            $tail = $lines | Select-Object -Last 12
            foreach ($line in $tail) {
              $text = $line.Replace('%', '%25').Replace("`r", ' ')
              if ($text.Length -gt 900) { $text = $text.Substring(0, 900) }
              Write-Host "::error title=test::$text"
            }
            exit 1
          }
