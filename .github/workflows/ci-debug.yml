name: ci-debug
on: [push]

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: diagnostics
        shell: bash
        run: |
          emit () {
            label="$1"
            shift
            if "$@" > out.txt 2>&1; then
              echo "ok: $label"
            else
              echo "FAILED: $label"
              body=$(tail -n 40 out.txt | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%s", (NR>1 ? "%0A" : ""), $0}')
              echo "::error::$label: $body"
            fi
          }
          rustc --version
          emit fmt cargo fmt --all -- --check
          emit clippy cargo clippy --all-targets -- -D warnings
          emit test cargo test --locked
