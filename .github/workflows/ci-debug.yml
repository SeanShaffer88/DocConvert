name: ci-debug
on:
  push:
    branches: [arena/b7712006-docconvert]
permissions:
  contents: read
  pull-requests: write
jobs:
  dbg:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > f.txt 2>&1
          code=$?
          python tools/report.py f.txt > report.md || true
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then gh pr comment "$pr" --body-file report.md || true; fi
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
      - name: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --message-format=short -- -D warnings > c.txt 2>&1
          code=$?
          python tools/report.py c.txt > report.md || true
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then gh pr comment "$pr" --body-file report.md || true; fi
          exit $code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
      - name: test
        shell: bash
        run: |
          set +e
          cargo test --locked --no-fail-fast > t.txt 2>&1
          code=$?
          python tools/report.py t.txt > report.md || true
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then gh pr comment "$pr" --body-file report.md || true; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
      - name: note
        if: always()
        shell: bash
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then gh pr comment "$pr" --body "debug run finished" || true; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
