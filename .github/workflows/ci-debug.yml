# TEMPORARY diagnostics workflow (deleted before merge).
# Run/job logs are unreachable from the agent sandbox, so clippy output is
# re-emitted as check-run annotations, which the API does return.
name: ci-debug
on:
  push:
    branches: [arena/b7712006-docconvert]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy with annotations
        shell: pwsh
        run: |
          cargo clippy --all-targets --message-format short -- -D warnings 2>&1 |
            Out-File -Encoding utf8 clippy.txt
          Get-Content clippy.txt -Encoding utf8 |
            Select-String -Pattern 'error|warning' |
            Select-Object -First 14 |
            ForEach-Object { Write-Host ("::error::" + $_.Line) }
          Get-Content clippy.txt -Encoding utf8 | Select-Object -Last 6
          exit 1
