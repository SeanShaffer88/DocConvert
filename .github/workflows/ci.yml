# Canonical CI for Sean's Rust Windows projects — copy to
# .github/workflows/ci.yml. NOTE: the GitHub App cannot create/edit files
# under .github/workflows/ (no Workflows permission), so this file is
# always added through the GitHub web UI.
#
# Steps mirror tools/gate.sh exactly, plus the one thing a local gate on
# Linux cannot do: really LINK and RUN on Windows (LNK2019-class errors
# and Windows-only test failures only appear here).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: clippy
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = cargo clippy --all-targets -- -D warnings 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $body = $out
            if ($body.Length -gt 60000) { $body = $body.Substring(0, 60000) }
            $body | Out-File -Encoding utf8 clippy.txt
            gh pr comment ${{ github.event.pull_request.number }} --body-file clippy.txt
            exit 1
          }
      - name: test
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = cargo test --locked 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $body = $out
            if ($body.Length -gt 60000) { $body = $body.Substring(0, 60000) }
            $body | Out-File -Encoding utf8 testlog.txt
            gh pr comment ${{ github.event.pull_request.number }} --body-file testlog.txt
            exit 1
          }
      - run: cargo build --release --locked
