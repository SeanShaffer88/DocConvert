# CI: the canonical copy, and the only one. Steps mirror tools/gate.sh
# exactly, plus the one thing a local gate on Linux cannot do: really
# LINK and RUN on Windows (LNK2019-class errors and Windows-only test
# failures only appear here).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  gate:
    runs-on: windows-latest
    # A parser that loops forever should fail the gate, not hold it open all
    # night: the suite takes a few minutes, so twenty is generous.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
