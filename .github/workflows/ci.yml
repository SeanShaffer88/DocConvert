# Canonical CI for Sean's Rust Windows projects — copy to
# .github/workflows/ci.yml. NOTE: the GitHub App cannot create/edit files
# under .github/workflows/ (no Workflows permission), so this file is
# always added through the GitHub web UI.
#
# Steps mirror tools/gate.sh exactly, plus the one thing a local gate on
# Linux cannot do: really LINK and RUN on Windows (LNK2019-class errors
# and Windows-only test failures only appear here).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # TEMPORARY: CI output is pushed back to the branch because the
      # log archive host is unreachable from the agent sandbox.
      - name: clippy
        shell: pwsh
        run: |
          $out = cargo clippy --all-targets -- -D warnings 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $out | Out-File -Encoding utf8 ci-log.txt
            git config user.name "ci-bot"
            git config user.email "ci-bot@example.com"
            git add -f ci-log.txt
            git commit -m "ci: clippy output [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
            exit 1
          }
      - name: test
        shell: pwsh
        run: |
          $out = cargo test --locked 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $out | Out-File -Encoding utf8 ci-log.txt
            git config user.name "ci-bot"
            git config user.email "ci-bot@example.com"
            git add -f ci-log.txt
            git commit -m "ci: test output [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
            exit 1
          }
      - run: cargo build --release --locked
