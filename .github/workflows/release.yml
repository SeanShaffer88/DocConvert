# Release workflow — pushing a `v*` tag builds the x64 DLL package and
# creates the GitHub Release with the zip attached (notes are written
# afterwards with `gh release edit`). The canonical copy: there is no
# second one at the repository root. Binaries are unsigned.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package x64 DLL zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $stage = "dist/DocConvert-$ver-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/docconvert.dll" $stage
          Copy-Item "target/release/docconvert.dll.lib" $stage
          Copy-Item "target/release/docconvert.exe" $stage
          Copy-Item "target/release/docconvert-mcp.exe" $stage
          Copy-Item "examples/convert_demo.c" $stage
          Copy-Item "assets/docconvert.ico" $stage
          Copy-Item "include/docconvert.h" $stage
          Copy-Item LICENSE $stage
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/DocConvert-$ver-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
