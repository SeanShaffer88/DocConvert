[package]
name = "docconvert"
version = "0.6.0"
edition = "2021"
rust-version = "1.80"
authors = ["Sean Shaffer"]
description = "Document conversion behind one clean C ABI, a scriptable CLI, and an MCP server — Markdown, HTML, CSV, JSON, plain text"
license = "MIT"
repository = "https://github.com/SeanShaffer88/DocConvert"
keywords = ["windows", "ffi"]
categories = ["os::windows-apis", "api-bindings"]

[lib]
name = "docconvert"
crate-type = ["cdylib", "rlib", "staticlib"]

# The command line front end (src/main.rs): same matrix, zero deps.
[[bin]]
name = "docconvert"
path = "src/main.rs"

# The Model Context Protocol server (src/mcp_main.rs) for local AI clients.
[[bin]]
name = "docconvert-mcp"
path = "src/mcp_main.rs"

# Zero dependencies by default. Win32 bindings are hand-declared in
# src/platform.rs with explicit #[link(name = "...")] on every extern
# block (advapi32 / shell32 / kernel32 / user32 as needed). Adding a
# dependency requires a written justification in the PR.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
